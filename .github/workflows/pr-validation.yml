name: PR Build and Unit Test

on:
  pull_request:
    branches:
      - uat
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Maven Build and Unit Test
    runs-on: ubuntu-latest

    steps:
      # Download the source code from the PR branch.
      - name: Checkout source
        uses: actions/checkout@v7

      # Install the same Java major version used by the application.
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Display versions in the CI log for troubleshooting and audit evidence.
      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      # Compile the application and execute unit tests.
      - name: Maven build and unit tests
        run: mvn -B clean verify
