services:
  mysql:
    image: mysql:8.4
    container_name: employee-onboarding-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: employee_onboarding
      MYSQL_USER: onboarding_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - employee_onboarding_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h localhost -u root --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employee-onboarding-app
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/employee_onboarding?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: onboarding_user
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8080
    ports:
      - "${APP_PORT:-8082}:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  employee_onboarding_mysql_data:
