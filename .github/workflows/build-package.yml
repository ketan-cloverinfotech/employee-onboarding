name: Build and Publish UAT Image

on:
  push:
    branches:
      - uat

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    name: Build Docker Image and Publish to GHCR
    runs-on: ubuntu-latest

    steps:
      # Download the exact source code merged into UAT.
      - name: Checkout source
        uses: actions/checkout@v7

      # Prepare Docker Buildx on the GitHub runner.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate to GitHub Container Registry.
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the application using the existing Dockerfile
      # and publish the resulting image to GitHub Packages.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:uat
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
